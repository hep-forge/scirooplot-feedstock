{% set versions = {
    "3.3.3": "77557e73add76d456940c7a0e99da3e1007c1b905b1ce73e37ae2f1e774b4497"
} %}

{% set version = environ.get('COMMIT_VERSION', None) %}
{% set version = version or versions.keys()|first %}
{% set version = version|string %}
{% set root_tag = (root or '')|replace('.', '') %}

{% set name = environ.get('ANACONDA_PACKAGE', 'scirooplot')|string|lower %}

package:
  name: {{ name }}
  version: {{ environ.get('ANACONDA_VERSION', version)|replace("-", ".") }}

source:
  url: "https://github.com/SciRooPlot/SciRooPlot/archive/refs/tags/v{{ version }}.tar.gz"
  {% if versions.get(version, None) %}
  sha256: {{ versions.get(version) }}
  {% endif %}

build:
  number: 0
  string: "root{{ root_tag }}"
  skip: true  # [not linux]
  run_exports:
    - {{ pin_subpackage(name, max_pin="x.x") }}

requirements:
  build:
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
    - {{ stdlib('c') }}
    - cmake
    - make
  host:
    - python
    - pybind11
    - fmt
    - libboost-devel
    - root {{ root }}.*
    - root-guard
  run:
    - python
    - root {{ root }}.*
    - root-guard

test:
  imports:
    - SciRooPlot
  commands:
    - srp info
    - test -f "${PREFIX}/include/SciRooPlot/PlotManager.h"

about:
  home: https://github.com/SciRooPlot/SciRooPlot
  doc_url: https://scirooplot.github.io/SciRooPlot/
  license: GPL-3.0-or-later
  license_file: LICENSE
  summary: Command-line plotting app to manage and visualize scientific data with ROOT

extra:
  recipe-maintainers:
    - meiyasan
